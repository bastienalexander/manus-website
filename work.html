<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light only"/>
  <link rel="stylesheet" href="https://use.typekit.net/hba8axj.css">
  <title>Manus — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'neue-haas-grotesk-display', 'Helvetica Neue', sans-serif; background: #eeeeee; color: #000; overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    :root {
      --bg:#eeeeee; --bg-footer:#f9f8f7; --text:#000; --text-dark:#111827;
      --fw-light:300; --fw-roman:400; --fw-medium:500;
      --f16:16px; --f20:20px; --f24:24px; --f32:32px; --f48:48px;
      --lh24:24px; --lh32:32px; --lh48:48px;
      --max:1440px; --nav-h:69px;
    }
    body.dark-mode { background:#111; color:#eee; --bg:#111; --bg-footer:#0a0a0a; --text:#eee; --text-dark:#ddd; }

    .sticky-frame { position:fixed; top:76px; left:50%; transform:translateX(-50%); width:min(calc(100vw - 80px),1407px); z-index:200; pointer-events:none; mix-blend-mode:difference; }
    .sticky-frame svg { width:100%; height:auto; display:block; }
    @media (max-width:1024px) {
      .sticky-frame { left:6px; transform:none; height:60svh; width:auto; }
      .sticky-frame svg { height:100%; width:auto; }
    }
    @media (max-width:900px) and (orientation:landscape) {
      .sticky-frame { display:none; }
    }

    header { position:sticky; top:0; z-index:300; mix-blend-mode:difference; width:100%; }
    .nav { display:flex; align-items:center; justify-content:space-between; height:var(--nav-h); padding:10px 40px; background:transparent; }
    .nav__logo svg { width:114px; height:20px; display:block; }
    .nav__list { display:flex; align-items:center; gap:28px; list-style:none; }
    .nav__item a { padding:10px; font-size:var(--f24); font-weight:var(--fw-roman); color:white; white-space:nowrap; }
    .nav__item--toggle button { background:none; border:none; cursor:pointer; padding:10px; color:white; display:flex; align-items:center; }
    .sun { display:block; } .moon { display:none; }
    body.dark-mode .sun { display:none; } body.dark-mode .moon { display:block; }
    .nav__hamburger { display:none; flex-direction:column; justify-content:space-between; width:28px; height:20px; background:none; border:none; cursor:pointer; padding:0; }
    .nav__hamburger span { display:block; width:100%; height:2px; background:white; transition:all 0.3s; }
    .nav__hamburger[aria-expanded="true"] span:nth-child(1) { transform:translateY(9px) rotate(45deg); }
    .nav__hamburger[aria-expanded="true"] span:nth-child(2) { opacity:0; }
    .nav__hamburger[aria-expanded="true"] span:nth-child(3) { transform:translateY(-9px) rotate(-45deg); }
    .nav__mobile-menu { display:none; flex-direction:column; position:fixed; top:var(--nav-h); left:0; width:100%; background:#111; z-index:299; max-height:0; overflow:hidden; transition:max-height 0.4s,padding 0.4s; padding:0 40px; }
    .nav__mobile-menu.is-open { max-height:500px; padding:20px 40px; }
    .nav__mobile-menu a { font-size:var(--f24); color:white; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.1); display:block; }
    #dm-btn { background:none; border:none; cursor:pointer; padding:12px 0; color:white; width:100%; text-align:left; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; }

    /* JS masonry — chronological order (p01 top-left, p02 next, etc.) */
    .grid { position:relative; padding:40px 80px 120px; }
    .pg { position:absolute; box-sizing:border-box; }
    .pg img { width:100%; height:auto; display:block; }

    /* Footer */
    .footer { background:var(--bg-footer); padding:64px 80px 24px; width:100%; }
    .footer__inner { max-width:var(--max); margin:0 auto; display:flex; align-items:flex-start; justify-content:space-between; }
    .footer__brand { display:flex; flex-direction:column; justify-content:space-between; padding-right:96px; width:224px; min-height:176px; }
    .footer__logo svg { width:114px; height:20px; display:block; }
    .footer__icon { width:73px; height:37px; }
    .footer__icon svg { width:100%; height:100%; }
    .footer__col { display:flex; flex-direction:column; padding:16px; width:224px; gap:4px; }
    .footer__col-heading { font-size:var(--f16); font-weight:var(--fw-medium); color:var(--text-dark); margin-bottom:4px; }
    .footer__col-link { font-size:var(--f16); font-weight:var(--fw-roman); color:var(--text-dark); }
    body.dark-mode .footer__col-heading, body.dark-mode .footer__col-link { color:#eee; }
    body.dark-mode .footer__logo path { fill:#eee; }
    body.dark-mode .footer__icon path { stroke:#eee; }

    @media (max-width:1024px) {
      .nav__list { display:none; } .nav__hamburger { display:flex; } .nav__mobile-menu { display:flex; }
      .grid { padding:40px 40px 80px; }
      .footer { padding:48px 40px 24px; }
      .footer__inner { flex-wrap:wrap; gap:24px; }
      .footer__brand { width:100%; padding-right:0; flex-direction:row; align-items:center; min-height:auto; }
      .footer__col { width:calc(50% - 12px); }
    }
    @media (max-width:768px) {
      .nav { padding:10px 20px; } .nav__mobile-menu { padding:0 20px; } .nav__mobile-menu.is-open { padding:20px; }
      .grid { padding:20px 20px 60px; }
      .footer { padding:48px 20px 24px; }
      .footer__brand { flex-direction:column; gap:24px; }
      .footer__col { width:100%; }
    }
</style>
</head>

<script>
    const dmBtn = document.getElementById('dm-btn');
    if (dmBtn) {
      if (localStorage.getItem('dm') === '1') document.body.classList.add('dark-mode');
      dmBtn.addEventListener('click', function() {
        const on = document.body.classList.toggle('dark-mode');
        localStorage.setItem('dm', on ? '1' : '0');
        // Sluit menu na klik
        document.querySelector('.nav__mobile-menu').classList.remove('is-open');
        document.querySelector('.nav__hamburger').setAttribute('aria-expanded', 'false');
      });
      // Sync desktop knop
      const dmDesktop = document.getElementById('dm-btn-desktop');
      function syncIcons(isDark) {
        [dmBtn, dmDesktop].forEach(function(btn) {
          if (!btn) return;
          const sun = btn.querySelector('.sun');
          const moon = btn.querySelector('.moon');
          if (sun) sun.style.display = isDark ? 'none' : 'block';
          if (moon) moon.style.display = isDark ? 'block' : 'none';
        });
      }
      // Zet icons goed bij laden
      syncIcons(document.body.classList.contains('dark-mode'));
      if (dmDesktop) {
        dmDesktop.addEventListener('click', function() {
          const on = document.body.classList.toggle('dark-mode');
          localStorage.setItem('dm', on ? '1' : '0');
          syncIcons(on);
        });
      }
      // Ook mobile knop synct icons
      if (dmBtn) {
        const origClick = dmBtn.onclick;
        dmBtn.addEventListener('click', function() {
          syncIcons(document.body.classList.contains('dark-mode'));
        });
      }
    }
    // Masonry — left-to-right reading order (p01, p02, p03...)
    (function() {
      const grid = document.querySelector('.grid');
      if (!grid) return;
      function cfg() {
        const w = window.innerWidth;
        if (w <= 768)  return { cols: 2, gap: 4 };
        if (w <= 1024) return { cols: 3, gap: 6 };
        return { cols: 4, gap: 8 };
      }
      function layout() {
        const { cols, gap } = cfg();
        const cs = getComputedStyle(grid);
        const pl = parseFloat(cs.paddingLeft);
        const pt = parseFloat(cs.paddingTop);
        const pb = parseFloat(cs.paddingBottom);
        const innerW = grid.clientWidth - pl - parseFloat(cs.paddingRight);
        const colW = (innerW - gap * (cols - 1)) / cols;
        const hs = new Array(cols).fill(0);
        const items = grid.querySelectorAll('.pg');
        items.forEach(function(item) {
          const col = hs.indexOf(Math.min.apply(null, hs));
          item.style.width = colW + 'px';
          item.style.left = (pl + col * (colW + gap)) + 'px';
          item.style.top  = (pt + hs[col]) + 'px';
          hs[col] += item.offsetHeight + gap;
        });
        grid.style.height = (pt + Math.max.apply(null, hs) - gap + pb) + 'px';
      }
      layout();
      grid.querySelectorAll('img').forEach(function(img) {
        if (!img.complete) img.addEventListener('load', layout);
      });
      var resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 120);
      });
    })();

    const hamburger = document.querySelector('.nav__hamburger');
    const mobileMenu = document.querySelector('.nav__mobile-menu');
    if (hamburger && mobileMenu) {
      hamburger.addEventListener('click', function () {
        const isOpen = mobileMenu.classList.toggle('is-open');
        hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
      mobileMenu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          mobileMenu.classList.remove('is-open');
          hamburger.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>
